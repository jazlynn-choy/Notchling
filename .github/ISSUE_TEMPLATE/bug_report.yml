name: Bug report
description: Something isn't working the way it should
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the panel
        2. Click ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Notchling version
      description: The release you downloaded, or select Notchling.app in Finder and choose File → Get Info.
      placeholder: v0.1.1
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: macOS 15.1, MacBook Air M2
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Optional. Reproduce the problem, then run this in Terminal and paste the output:
        `log show --last 10m --predicate 'subsystem == "local.notchling"' --info --debug`
      render: text
